<div class="textarea">
  <label class="textarea__label" [for]="textareaId">
    {{ label }} <span class="textarea__required">*</span>
  </label>
  <div class="textarea__wrapper">
    <textarea
    class="textarea__field"
    [ngClass]="{ 'textarea__field--error': control.invalid && (control.touched || control.dirty) }"
    [formControl]="control"
    [placeholder]="placeholder"
    [id]="textareaId"
></textarea>

    <div class="textarea__counter">
      <span class="textarea__current">{{ control.value?.length || 0 }}</span>
      <span class="textarea__max">/90</span>
    </div>
  </div>

  <span class="textarea__error" [ngClass]="{ 'textarea__error--visible': control.invalid && (control.touched || control.dirty) }">
    {{ getErrorMessage() }}
  </span>


</div>
