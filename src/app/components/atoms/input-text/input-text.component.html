<div class="input-text">
  <label
    *ngIf="label || showLabelSpace"
    class="input-text__label"
    [class.input-text__label--hidden]="!label && showLabelSpace"
    [for]="inputId"
  >
    {{ label }} <span *ngIf="required" class="input-text__required">*</span>
  </label>
  <input
    class="input-text__field"
    [ngClass]="{ 'input-text__field--error': control.invalid && (control.touched || control.dirty) }"
    [formControl]="control"
    [placeholder]="placeholder"
    [id]="inputId"
    [maxlength]="50"
    [type]="type"
  />
  <span
    class="input-text__error"
    [ngClass]="{
      'input-text__error--visible': control.invalid && (control.touched || control.dirty),
      'input-text__error--hidden': !showErrorSpace && !(control.invalid && (control.touched || control.dirty))
    }"
  >
    {{ getErrorMessage() }}
  </span>
</div>
